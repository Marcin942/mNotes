# Szkic (3a-2), nieuruchamiany: testy JVM obu wariantów i APK foss; na gałęzi `kreda` dodatkowo sprawdzenie, że
# zmienia ona tylko katalogi kredy (wtedy scalanie main → kreda nie ma konfliktów).
name: testy

on:
  push:
  pull_request:

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Platforma Androida
        run: sdkmanager "platforms;android-36.1"
      - name: Testy JVM
        run: ./gradlew --no-daemon :app:testFossDebugUnitTest :app:testGmsDebugUnitTest :app:assembleFossDebug
      - name: Gałąź kredy zmienia tylko swoje katalogi
        if: github.ref == 'refs/heads/kreda'
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -v -E '^app/src/(kreda|testKreda)/'; then
            echo "Gałąź kreda zmienia pliki spoza app/src/kreda i app/src/testKreda" >&2
            exit 1
          fi
